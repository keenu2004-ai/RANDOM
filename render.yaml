services:
  # -------------------------------------------------------------------
  # 1. Express Backend Web Service
  # -------------------------------------------------------------------
  - type: web
    name: theiakshi-hrms-backend
    env: node
    region: singapore
    plan: free
    buildCommand: npm install && npm run build:server
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_PROVIDER
        value: postgres
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false

  # -------------------------------------------------------------------
  # 2. React Vite Frontend Static Site
  # -------------------------------------------------------------------
  - type: static
    name: theiakshi-hrms-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://random-ehwm.onrender.com
